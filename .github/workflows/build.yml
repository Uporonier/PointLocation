name: Build Pinpoint unsigned IPA
on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
      - '*.md'
      - '*.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        run: bash scripts/build-pinpoint.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pinpoint-unsigned
          path: |
            build/Pinpoint-unsigned.ipa
            build/Pinpoint-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
